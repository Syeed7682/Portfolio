  <!-- Instant Theme Initializer & Complete Cache Cleaner -->
  <script>
    (function () {
      try {
        var currentCacheKey = 'syeed_portfolio_cached_data_v5';
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && (k.startsWith('syeed_portfolio_') || k.includes('cached_data')) && k !== currentCacheKey) {
            localStorage.removeItem(k);
          }
        }
        var cached = localStorage.getItem(currentCacheKey);
        if (cached) {
          var data = JSON.parse(cached);
          if (data && data.theme) {
            if (data.theme.mode === 'dark') {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
            if (data.theme.preset) {
              document.documentElement.setAttribute('data-preset', data.theme.preset);
            }
          }
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-preset', 'midnight');
        }
      } catch (e) { }
    })();
  </script>
